n, now)\n    bucket.refill(now)\n    taken = bucket.tryTake()\n    If taken:\n      Return allowed\n    Return denied + retryAfter = bucket.secondsUntilNext(), rounded up\n\n    changes buckets · depends on time","effects":["changes buckets","depends on time"]},{"id":"RateLimiter.bucketFor","name":"bucketFor","kind":"function","status":"added","visibility":"private","signature":"(client, plan, now) → bucket","source":{"lines":[21,29],"file":"src/limits/rate-limiter.ts","code":"  private bucketFor(clientId: string, plan: Plan, now: number): TokenBucket {\n    let bucket = this.buckets.get(clientId);\n    if (!bucket) {\n      const { burst, perSecond } = LIMITS[plan];\n      bucket = new TokenBucket(burst, perSecond, now);\n      this.buckets.set(clientId, bucket);\n    }\n    return bucket;\n  }"},"summary":"Find the client’s bucket, creating a full one from their plan’s limits the first time.","klar":"  private bucketFor(client, plan, now) → bucket\n    bucket = get buckets[client]\n    If bucket is missing:\n      limits = config.LIMITS[plan]\n      bucket = create TokenBucket(limits.burst, limits.perSecond, now)\n      add bucket to buckets for client\n    Return bucket\n\n    changes buckets","effects":["changes buckets"]}],"summary":"Gives each client a token bucket sized by their plan.","klar":"+ class RateLimiter\n    needs clock\n    state buckets = one TokenBucket per client, never removed"},{"id":"TokenBucket","name":"TokenBucket","kind":"class","status":"added","group":"src/limits","file":"src/limits/token-bucket.ts","members":[{"id":"TokenBucket.refill","name":"refill","kind":"function","status":"added","signature":"(now)","source":{"lines":[10,14],"file":"src/limits/token-bucket.ts","code":"  refill(now: number): void {\n    const elapsed = (now - this.updatedAt) / 1000;\n    this.tokens = Math.min(this.capacity, this.tokens + elapsed * this.refillPerSecond);\n    this.updatedAt = now;\n  }"},"summary":"Add the tokens earned since the last refill, never const __sizes_ts = (() => {
// The sizes and behaviour the layout and the camera depend on, read from the design tokens.
// Durations are in milliseconds.
//
// num reads one token as a number: in the viewer from the page's CSS custom properties, and in
// the build from tools/tokens.ts, so both see the same values. Nothing here touches the DOM.

function sizesFrom(num                          ) {
  return {
    unit: num("grid-unit"), canvas: num("grid-canvas"),
    headH: num("card-head-height"), sumH: num("card-summary-height"), rowH: num("card-row-height"),
    padX: num("card-padding-x"), padY: num("card-padding-y"), gutter: num("card-gutter"), kind: num("card-kind"),
    wMin: num("card-width-min"), wMax: num("card-width-max"), gap: num("space-2"), gapSm: num("space-1"),
    badge: num("badge-size"), mark: num("badge-mark"),
    layerGap: num("diagram-layer-gap"), nodeGap: num("diagram-node-gap"), edgeGap: num("diagram-edge-gap"), margin: num("space-10"),
    slow: num("motion-duration-slow"), settle: num("diagram-settle-delay"), paintDelay: num("diagram-paint-delay"), fontTimeout: num("diagram-font-timeout"),
    zoomMin: num("diagram-zoom-min"), zoomMax: num("diagram-zoom-max"), zoomStep: num("diagram-zoom-step"), zoomWheel: num("diagram-zoom-wheel"),
    zoomFocus: num("diagram-zoom-focus"), detailZoom: num("diagram-detail-zoom"), dragThreshold: num("diagram-drag-threshold"),
    edgeMargin: num("diagram-edge-margin"), edgeMarginMoving: num("diagram-edge-margin-moving"), edgeDensityMoving: num("diagram-edge-density-moving"),
    largeGraph: num("diagram-large-graph"),
  };
}

                                                 

return { sizesFrom };
})();

const __util_ts = (() => {
// DOM helpers and design tokens, shared by every part of the viewer.

const { sizesFrom } = __sizes_ts;

// The viewer's own markup always has what it looks for, so a miss is a bug, not a case to handle.
const $ =                                  (s        , el             = document)    => el.querySelector   (s) ;
const $$ =                                  (s        , el             = document)      => [...el.querySelectorAll   (s)];
// The element an event happened in, or its nearest ancestor, that matches a selector.
const closest =                                  (e       , s        )           => (e.target           ).closest?.   (s) ?? null;

const ENTITIES                         = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
// Everything that comes from the graph goes through esc() before it reaches markup.
const esc = (s         )         => String(s ?? "").replace(/[&<>"']/g, (c) => ENTITIES[c]);

// Tokens are the CSS custom properties tools/tokens.ts generates from design/. The computed
// style is live, so reads after a theme change see the new theme.
const rootStyle = getComputedStyle(document.documentElement);
const token = (name        )         => rootStyle.getPropertyValue("--" + name).trim();
const num = (name        )         => parseFloat(token(name));

// The sizes and behaviour the layout and the camera depend on.
const L = sizesFrom(num);

// Matches when the sidebar and inspector are sheets over the canvas.
const narrow = matchMedia(`(max-width: ${token("breakpoint-narrow")})`);

return { $, $$, closest, esc, token, num, L, narrow };
})();

const __model_ts = (() => {
// The graph, indexed for lookups by id, and what each status looks like in the viewer.

                                                                                     

                                                                                  

// rank orders statuses when several edges are drawn as one; the strongest wins.
const STATUS                             = {
  added: { label: "new", mark: "+", rank: 3, whole: "New class" },
  changed: { label: "changed", mark: "~", rank: 1 },
  removed: { label: "removed", mark: "−", rank: 2, whole: "Removed class" },
  context: { label: "context", mark: "", rank: 0 },
};
const statusOf = (s        )             => STATUS[s          ] ?? STATUS.context;
const STATUSES = Object.keys(STATUS)            ;

// A member that knows its component.
                                                                      
// An edge with its index in model.edges and its resolution filled in.
                                                                               
                                                  

function indexGraph(G       ) {
  const comps = new Map                   (), members = new Map                       (), rowOf = new Map                ();
  for (const c of G.components) {
    comps.set(c.id, c);
    c.members.forEach((m, i) => { const im = Object.assign(m, { component: c }); members.set(m.id, im); rowOf.set(m.id, i); });
  }
  const compOf = (id                           )                        => (id == null ? undefined : members.get(id)?.component || comps.get(id));

  // Edges whose ends are missing cannot be drawn; a built graph has none.
  const edges                = G.edges.filter((e) => compOf(e.from) && compOf(e.to)).map((e, i) => ({ resolution: "static", ...e, i }));
  const outE = new Map                       (), inE = new Map                       ();
  const push = (map                            , key        , e             ) => (map.get(key) ?? map.set(key, []).get(key) ).push(e);
  for (const e of edges) { push(outE, e.from, e); push(inE, e.to, e); }

  // One edge per ordered pair of cards, in the strongest status among the edges it stands for.
  // The layout uses these, and so does the far view, where member edges join up.
  const pairs = new Map              ();
  for (const e of edges) {
    const a = compOf(e.from) .id, b = compOf(e.to) .id;
    if (a === b) continue;
    const key = a + ">" + b, prev = pairs.get(key);
    if (!prev || statusOf(e.status).rank > statusOf(prev.status).rank) pairs.set(key, { from: a, to: b, status: e.status, kind: "calls", resolution: "static" });
  }

  // Edges touching an id; for a component, also those touching its members.
  const relatedEdges = (id        )                => {
    const c = comps.get(id);
    const ids = c ? [id, ...c.members.map((m) => m.id)] : [id];
    return ids.flatMap((x) => [...(outE.get(x) || []), ...(inE.get(x) || [])]);
  };

  return { G, comps, members, rowOf, compOf, edges, outE, inE, cardEdges: [...pairs.values()], relatedEdges };
}

return { STATUS, statusOf, STATUSES, indexGraph };
})();

const __sidebar_ts = (() => {

const __card_size_ts = (() => {
// How big each card is. Height comes from the tokens alone; width comes from the widest line the
// card shows, so it depends on how wide text is. The viewer measures text in the fonts it draws
// with, and the build estimates it, so this module takes a measure function and touches no DOM.

const { STATUS, STATUSES, statusOf } = __model_ts;
                                        
                                            

// The text roles a card's width depends on.
const ROLES = ["heading", "code-strong", "code-sm", "code-meta"]         ;
                                          
                                                           

// `(client: string, plan = "free") -> Decision` reads as `(client, plan) → Decision`.
const shortSig = (s = "")         => {
  const m = s.match(/^\((.*?)\)(.*)$/);
  if (!m) return s;
  const params = m[1].split(",").map((p) => p.split(/[:=]/)[0].trim()).filter(Boolean).join(", ");

};
const shortPath = (f = "")         => f.replace(/^src\//, "");

// Counts of what changed inside a card, as shown in its header.
const CHANGES = STATUSES.filter((s) => s !== "context");

  function componentBody(c           )         {
    const usedBy = [...c.members.flatMap((x) => inE.get(x.id) || []), ...(inE.get(c.id) || [])].filter((e) => compOf(e.from) !== c);
    const memberLinks = c.members.map((x) => `<li><button type="button" data-goto="${esc(x.id)}"><span class="ek type-code-meta">${memberKind(x.kind)}</span><span class="dot s-${esc(x.status)}"></span><span class="en type-code-strong">${esc(x.name)}</span></button></li>`);
    return `
      <h2 class="type-title-code">${esc(c.name)}</h2>
      <div class="badges">${pill(c.status)}${tag(c.kind)}</div>
      ${c.summary ? `<p class="lead type-lead">${esc(c.summary)}</p>` : ""}
      ${c.klar ? section("Klar", `<pre class="klar type-code">${klarHTML(c.klar, c.id)}</pre>`) : ""}
      ${section("Members", `<ul class="links">${memberLinks.join("")}</ul>`)}
      ${usedBy.length ? section("Used by", linkList(usedBy, "in")) : ""}
      ${notesFor(c.id)}`;
  }

  drawer.addEventListener("click", (e) => {
    const t = closest(e, "[data-tab]");
    if (!t) return;
    for (const b of $$("[data-tab]", drawer)) b.classList.toggle("on", b === t);
    for (const p of $$("[data-pane]", drawer)) p.hidden = p.dataset.pane !== t.dataset.tab;
  });

  return {
    open(id) {
      const m = members.get(id), c = compOf(id);
      if (!c) return;
      const top = `<div class="dw-top"><span class="crumb type-code-meta">${esc(c.file)}</span><button class="x" type="button" aria-label="Close">${ICON.close}</button></div>`;
      drawer.innerHTML = `<div class="dw">${top}${m ? memberBody(m, c) : componentBody(c)}</div>`;
      drawer.classList.add("open");
      app.classList.add("inspecting");
      drawer.scrollTop = 0;
    },
    close() {
      drawer.classList.remove("open");
      app.classList.remove("inspecting");
    },
  };
}

return { createInspector };
})();

// The OpenArc viewer. Loads a graph, lays its cards out, and wires up selection, flows and notes.
//
// The graph comes from <script id="openarc-data"> in a built page, or from ?src= (default
// graph.json) in the unbuilt viewer.

const { $, $$, L, closest } = __util_ts;
const { indexGraph } = __model_ts;
const { renderSide } = __sidebar_ts;
const { loadFonts, cardWidth, cardHeight, cardHTML } = __cards_ts;
const { layoutCards } = __layout_ts;
                                       
const { createGeometry, headAt, edgeHTML } = __edges_ts;
const { createEdgePainter, toLine } = __painter_ts;
const { createView } = __view_ts;
const { createKlar } = __klar_ts;
const { createInspector } = __inspector_ts;
                                        

const app = $("#app"), side = $("#side"), stage = $("#stage"), world = $("#world"), nodesEl = $("#nodes");
const drawer = $("#drawer"), loading = $("#loading");

async function loadGraph()                 {
  const inline = $("#openarc-data").textContent?.trim();
  if (inline) return JSON.parse(inline);
  const src = new URLSearchParams(location.search).get("src") || "graph.json";
  const res = await fetch(src);
  if (!res.ok) throw new Error(`could not load ${src} (${res.status})`);
  return res.json();
}

let model       , laid      ;
try {
  model = indexGraph(await loadGraph());
  document.title = `${model.G.change.title} · OpenArc`;
  renderSide(side, model);
  await loadFonts();
  const cards = model.G.components.map((c) => ({ id: c.id, w: cardWidth(c), h: cardHeight(c) }));
  laid = await layoutCards(cards, model.cardEdges);
} catch (err) {
  loading.textContent = `The diagram could not be shown: ${(err         ).message}`;
  loading.classList.add("failed");
  throw err;
}
loading.remove();
const { G, comps, members, compOf, edges, cardEdges, relatedEdges } = model;
const { pos } = laid;

nodesEl.innerHTML = laid.order.map((id) => cardHTML(comps.get(id) , pos.get(id) )).join("");

// ---------- edges ----------
const pathBetween = createGeometry(model, pos);
const paths = edges.map((e) => pathBetween(e.from, e.to));
const painter = createEdgePainter($                   ("#edges"), {
  member: edges.map((e, i) => toLine(e, paths[i])),
  card: cardEdges.map((e) => toLine(e, pathBetween(e.from, e.to))),
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => painter.restyle());

const overlay = $               ("#overlay");
overlay.setAttribute("width", String(laid.width)); overlay.setAttribute("height", String(laid.height));
overlay.innerHTML = `<g id="hlLayer"></g><g id="hovLayer"></g><g id="flowLayer"></g>`;
const hlLayer = $             ("#hlLayer"), hovLayer = $             ("#hovLayer"), flowLayer = $             ("#flowLayer");
const edgeMarkup = (i        , cls        ) => edgeHTML(edges[i], paths[i], cls);

const view = createView({
  stage, world, pct: $(".pct"), drawer, zoombar: $(".zoombar"), painter,
  size: { width: laid.width, height: laid.height },
});
const focusIds = (ids          ) => view.focus(ids.map((id) => pos.get(compOf(id)?.id ?? "")).filter((b) => b !== undefined));

const inspector = createInspector(drawer, app, model, createKlar(model));

// ---------- selection, flows, notes ----------
// One thing is in focus at a time: a selected card or member, a flow, or a note. highlight()
// works out what that lights up and changes only the elements whose state differs from before.
const S                                                                   = { sel: null, flow: null, note: null };
const rowEls = new Map($$(".row, .card-head", nodesEl).map((el) => [el.dataset.id , { el, step: $(".step", el) }]));
const cardEls = new Map($$(".card", nodesEl).map((el) => [el.dataset.c , el]));
const flowEls = $$(".flow", side), noteEls = $$(".note[data-note]", side);
                                                                                                                                                 
let lit      = { rows: new Set(), sel: new Set(), cards: new Set(), selc: new Set(), steps: new Map() };

function swap(before                  , after                  , cls        )       {
  for (const el of before) if (!after.has(el)) el.classList.remove(cls);
  for (const el of after) if (!before.has(el)) el.classList.add(cls);
}

function highlight()       {
  const nodes = new Set        (), hlEdges = new Set        (), steps = new Map                ();
  flowLayer.innerHTML = "";
  if (S.flow) {
    const f = G.flows .find((x) => x.id === S.flow) ;
    f.steps.forEach((s, i) => { nodes.add(s); if (!steps.has(s)) steps.set(s, i + 1); });
    const segs = f.steps.slice(1).map((s, i) => pathBetween(f.steps[i], s));
    flowLayer.innerHTML = `<path class="flowpath" d="${segs.map((x) => x.d).join(" ")}"/><g class="flowheads">${segs.map(headAt).join("")}</g>`;
  }
  if (S.note != null) for (const r of G.notes [S.note].refs) { nodes.add(r); relatedEdges(r).forEach((e) => hlEdges.add(e.i)); }
  const sel = S.sel;
  if (sel) {
    nodes.add(sel);
    comps.get(sel)?.members.forEach((m) => nodes.add(m.id));
    for (const e of relatedEdges(sel)) { hlEdges.add(e.i); nodes.add(e.from); nodes.add(e.to); }
  }

  const next      = {
    rows: new Set([...nodes].map((id) => rowEls.get(id)?.el).filter((el) => el !== undefined)),
    sel: new Set(sel && members.has(sel) ? [rowEls.get(sel) .el] : []),
    cards: new Set([...nodes].map((id) => cardEls.get(compOf(id)?.id ?? "")).filter((el) => el !== undefined)),
    selc: new Set(sel && comps.has(sel) ? [cardEls.get(sel) ] : []),
    steps: new Map([...steps].filter(([id]) => rowEls.has(id)).map(([id, n]) => [rowEls.get(id) .step, String(n)])),
  };
  swap(lit.rows, next.rows, "hl");
  swap(lit.sel, next.sel, "sel");
  swap(lit.cards, next.cards, "hl");
  swap(lit.selc, next.selc, "selc");
  for (const el of lit.steps.keys()) if (!next.steps.has(el)) { el.textContent = ""; el.classList.remove("on"); }
  for (const [el, n] of next.steps) { el.textContent = n; el.classList.add("on"); }
  lit = next;

  app.classList.toggle("focus", nodes.size > 0);
  hlLayer.innerHTML = [...hlEdges].map((i) => edgeMarkup(i, "hl")).join("");
  for (const b of flowEls) b.classList.toggle("on", b.dataset.flow === S.flow);
  for (const b of noteEls) b.classList.toggle("on", Number(b.dataset.note) === S.note);
}

function select(id               , { pan = true } = {})       {
  S.sel = id;
  highlight();
  if (!id) return inspector.close();
  inspector.open(id);
  if (pan || hiddenByDrawer(id)) focusIds([id]);
}
function clear()       {
  S.flow = null; S.note = null;
  select(null);
}
function hiddenByDrawer(id        )          {
  const r = cardEls.get(compOf(id) .id) .getBoundingClientRect(), s = stage.getBoundingClientRect(), v = view.visible();
  return r.right > s.left + v.w - L.padX || r.bottom > s.top + v.h - L.padX || r.left < s.left || r.top < s.top;
}

nodesEl.addEventListener("click", (e) => {
  if (view.wasDragged()) return;
  const el = closest(e, "[data-id]");
  if (el) select(el.dataset.id , { pan: false });
});
stage.addEventListener("click", (e) => {
  if (view.wasDragged() || closest(e, "[data-id], #drawer, .zoombar, #sideToggle")) return;
  clear();
});
drawer.addEventListener("click", (e) => {
  if (closest(e, ".x")) { S.note = null; select(null); return; }
  const g = closest(e, "[data-goto]");
  if (g) { S.note = null; select(g.dataset.goto ); }
});

// Hover draws the related edges again, thicker, on the overlay. Nothing else is restyled, and
// nothing happens while the canvas is being dragged across cards.
let hovId                = null;
function hover(id               )       {
  if (id === hovId) return;
  hovId = id;
  hovLayer.innerHTML = id ? relatedEdges(id).map((e) => edgeMarkup(e.i, "hov")).join("") : "";
}
nodesEl.addEventListener("pointerover", (e) => { if (!view.isDragging()) hover(closest(e, "[data-id]")?.dataset.id ?? null); });
nodesEl.addEventListener("pointerleave", () => hover(null));

side.addEventListener("click", (e) => {
  const f = closest(e, "[data-flow]"), n = closest(e, "[data-note]");
  if (f) {
    S.flow = S.flow === f.dataset.flow ? null : f.dataset.flow ; S.note = null; S.sel = null;
    inspector.close(); highlight();
    if (S.flow) focusIds(G.flows .find((x) => x.id === S.flow) .steps);
  }
  if (n) {
    const i = Number(n.dataset.note);
    S.note = S.note === i ? null : i; S.flow = null; S.sel = null; highlight();
    if (S.note != null) { inspector.open(G.notes [i].refs[0]); focusIds(G.notes [i].refs); } else inspector.close();
  }
  if (f || n) app.classList.remove("side-open");
});
$("#sideToggle").addEventListener("click", () => app.classList.toggle("side-open"));
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !closest(e, "input, textarea")) clear();
});

view.fit(false);
</script>
</body>
</html>
