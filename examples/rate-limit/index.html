it(limiter: RateLimiter): Middleware {\n  return async (req, next) => {\n    const user = req.user;\n    if (!user) return next(req);\n    const decision = limiter.check(user.id, user.plan);\n    if (!decision.allowed) {\n      return { status: 429, headers: { \"retry-after\": String(decision.retryAfter) } };\n    }\n    return next(req);\n  };\n}"},"summary":"Build a request step that turns a client away with 429 once their allowance runs out.","klar":"  rateLimit(limiter) → request step(request, next = rest of the chain)\n    If request has no user:\n      Return next(request)\n    decision = limiter.check(user.id, user.plan)\n    If decision is denied:\n      Return 429 + retry-after = decision.retryAfter\n    Return next(request)\n\n    no effects","effects":[]}]},{"id":"RateLimiter","name":"RateLimiter","kind":"class","status":"added","group":"src/limits","file":"src/limits/rate-limiter.ts","members":[{"id":"RateLimiter.buckets","name":"buckets","kind":"state","status":"added","signature":"= one TokenBucket per client","summary":"One bucket per client ever seen; never evicted.","source":{"lines":[9,9],"file":"src/limits/rate-limiter.ts","code":"  private buckets = new Map\u003cstring, TokenBucket>();"},"klar":"  state buckets = one TokenBucket per client, never removed"},{"id":"RateLimiter.check","name":"check","kind":"function","status":"added","signature":"(client, plan) → allowed | denied","source":{"lines":[13,19],"file":"src/limits/rate-limiter.ts","code":"  check(clientId: string, plan: Plan): Decision {\n    const now = this.clock.now();\n    const bucket = this.bucketFor(clientId, plan, now);\n    bucket.refill(now);\n    if (bucket.tryTake()) return { allowed: true };\n    return { allowed: false, retryAfter: Math.ceil(bucket.secondsUntilNext()) };\n  }"},"summary":"Spend one token for this client, or say how many seconds until one is available.","klar":"  check(client, plan) → allowed | denied\n    now = clock.now()\n    bucket = bucketFor(client, plan, now)\n    bucket.refill(now)\n    taken = bucket.tryTake()\n    If taken:\n      Return allowed\n    Return denied + retryAfter = bucket.secondsUntilNext(), rounded up\n\n    changes buckets · depends on time","effects":["changes buckets","depends on time"]},{"id":"RateLimiter.bucketFor","name":"bucketFor","kind":"function","status":"added","visibility":"private","signature":"(client, plan, now) → bucket","source":{"lines":[21,29],"file":"src/limits/rate-limiter.ts","code":"  private bucketFor(clientId: string, plan: Plan, now: number): TokenBucket {\n    let bucket = this.buckets.get(clientId);\n    if (!bucket) {\n      const { burst, perSecond } = LIMITS[plan];\n      bucket = new TokenBucket(burst, perSecond, now);\n      this.buckets.set(clientId, bucket);\n    }\n    return bucket;\n  }"},"summary":"Find the client’s bucket, creating a full one from their plan’s limits the first time.","klar":"  private bucketFor(client, plan, now) → bucket\n    bucket = get buckets[client]\n    If bucket is missing:\n      limits = config.LIMITS[plan]\n      bucket = create TokenBucket(limits.burst, limits.perSecond, now)\n      add bucket to buckets for client\n    Return bucket\n\n    changes buckets","effects":["changes buckets"]}],"summary":"Gives each client a token bucket sized by their plan.","klar":"+ class RateLimiter\n    needs clock\n    state buckets = one TokenBucket per client, never removed"},{"id":"TokenBucket","name":"TokenBucket","kind":"class","status":"added","group":"src/limits","file":"src/limits/token-bucket.ts","members":[{"id":"TokenBucket.refill","name":"refill","kind":"function","status":"added","signature":"(now)","source":{"lines":[10,14],"file":"src/limits/token-bucket.ts","code":"  refill(now: number): void {\n    const elapsed = (now - this.updatedAt) / 1000;\n    this.tokens = Math.min(this.capacity, this.tokens + elapsed * this.refillPerSecond);\n    this.updatedAt = now;\n  }"},"summary":"Add the tokens earned since the last refill, never exceeding capacity.","klar":"  refill(now)\n    elapsed = now − updatedAt, in seconds\n    set tokens = min(capacity, tokens + elapsed × refillPerSecond)\n    set updatedAt = now\n\n    changes tokens, updatedAt","effects":["changes tokens, updatedAt"]},{"id":"TokenBucket.tryTake","name":"tryTake","kind":"function","status":"added","signature":"() → yes | no","source":{"lines":[16,20],"file":"src/limits/token-bucket.ts","code":"  tryTake(): boolean {\n    if (this.tokens \u003c 1) return false;\n    this.tokens -= 1;\n    return true;\n  }"},"summary":"Take one token if a whole one is left.","klar":"  tryTake() → yes | no\n    If tokens \u003c 1:\n      Return no\n    set tokens = tokens − 1\n    Return yes\n\n    changes tokens","effects":["changes tokens"]},{"id":"TokenBucket.secondsUntilNext","name":"secondsUntilNext","kind":"function","status":"added","signature":"() → seconds","source":{"lines":[22,24],"file":"src/limits/token-bucket.ts","code":"  secondsUntilNext(): number {\n    return this.tokens >= 1 ? 0 : (1 - this.tokens) / this.refillPerSecond;\n  }"},"summary":"How long until a whole token is available; zero if one already is.","klar":"  secondsUntilNext() → seconds\n    If tokens ≥ 1:\n      Return 0\n    Return (1 − tokens) ÷ refillPerSecond\n\n    no effects","effects":[]}],"summary":"An allowance that holds up to capacity tokens and regains refillPerSecond every second.","klar":"+ class TokenBucket\n    needs capacity, refillPerSecond, now\n    state tokens = capacity at start\n    state updatedAt = now at start"},{"id":"Clock","name":"Clock","kind":"interface","status":"added","group":"src","file":"src/clock.ts","members":[{"id":"Clock.now","name":"now","kind":"function","status":"added","signature":"() → time in ms","summary":"The current time in milliseconds.","source":{"lines":[2,2],"file":"src/clock.ts","code":"  now(): number;"},"klar":"  now() → time in ms"},{"id":"Clock.systemClock","name":"systemClock","kind":"const","status":"added","signature":"= reads the system time","summary":"Default implementation backed by the wall clock.","source":{"lines":[5,5],"file":"src/clock.ts","code":"export const systemClock: Clock = { now: () => Date.now() };"},"klar":"  const systemClock = Clock that reads the system time"}],"summary":"Where the current time comes from; injected so rate limits can be tested."},{"id":"config","name":"config","kind":"module","status":"changed","group":"src","file":"src/config.ts","members":[{"id":"config.LIMITS","name":"LIMITS","kind":"const","status":"added","signature":"= burst and refill rate per plan","source":{"lines":[4,7],"file":"src/config.ts","code":"export const LIMITS: Record\u003cPlan, { burst: number; perSecond: number }> = {\n  free: { burst: 20, perSecond: 1 },\n  pro: { burst: 100, perSecond: 10 },\n};"},"summary":"How many requests each plan may burst, and how fast that allowance refills.","klar":"+ const LIMITS = burst size and refill rate for each plan\n    free: burst 20, then 1 per second\n    pro: burst 100, then 10 per second"},{"id":"config.MAX_ORDERS_PER_MINUTE","name":"MAX_ORDERS_PER_MINUTE","kind":"const","status":"removed","signature":"= 5","summary":"Per-user cap on order creation.","base":{"lines":[2,2],"file":"src/config.ts","code":"export const MAX_ORDERS_PER_MINUTE = 5;"},"klar":"- const MAX_ORDERS_PER_MINUTE = 5"}]},{"id":"orders","name":"orders","kind":"module","status":"changed","group":"src","file":"src/orders.ts","members":[{"id":"orders.recentOrders","name":"recentOrders","kind":"state","status":"removed","signature":"= order times per user","summary":"Timestamps of each user's recent orders.","base":{"lines":[5,5],"file":"src/orders.ts","code":"const recentOrders = new Map\u003cstring, number[]>();"},"klar":"- state recentOrders = order times for each user"},{"id":"orders.listOrders","name":"listOrders","kind":"function","status":"context","signature":"(request) → 200 + orders","summary":"Return the signed-in user's orders.","source":{"lines":[4,7],"file":"src/orders.ts","code":"export const listOrders: Handler = async (req) => {\n  const orders = await db.orders.forUser(req.user!.id);\n  return { status: 200, body: orders };\n};"},"klar":"  listOrders(request) → 200 + orders …"},{"id":"orders.createOrder","name":"createOrder","kind":"function","status":"changed","signature":"(request) → 201 + order","source":{"lines":[9,12],"file":"src/orders.ts","code":"export const createOrder: Handler = async (req) => {\n  const order = await db.orders.insert(req.user!.id, req.body);\n  return { status: 201, body: order };\n};"},"base":{"lines":[12,20],"file":"src/orders.ts","code":"export const createOrder: Handler = async (req) => {\n  const userId = req.user!.id;\n  const now = Date.now();\n  const recent = (recentOrders.get(userId) ?? []).filter((t) => now - t \u003c 60_000);\n  if (recent.length >= MAX_ORDERS_PER_MINUTE) return { status: 429 };\n  recentOrders.set(userId, [...recent, now]);\n  const order = await db.orders.insert(userId, req.body);\n  return { status: 201, body: order };\n};"},"summary":"Store a new order for the signed-in user.","klar":"~ createOrder(request) → 201 + order\n-   remove times older than 1 min from recentOrders[user]\n-   If recentOrders[user] has ≥ MAX_ORDERS_PER_MINUTE entries:\n-     Return 429\n-   add now to recentOrders[user]\n    order = Wait for db.orders.insert(user.id, request.body)\n    Return 201 + order\n\n-   changes recentOrders · depends on time\n    writes db","effects":["writes db"],"baseEffects":["changes recentOrders","depends on time","writes db"]}],"klar":"~ module orders\n-   state recentOrders = order times for each user"},{"id":"db","name":"db","kind":"module","status":"context","group":"src","file":"src/db.ts","members":[{"id":"db.orders.insert","name":"orders.insert","kind":"function","status":"context","signature":"(user, order) → order","summary":"Persist a new order.","source":{"lines":[6,8],"file":"src/db.ts","code":"    async insert(userId: string, order: unknown): Promise\u003cunknown> {\n      return { id: crypto.randomUUID(), userId, ...(order as object) };\n    },"},"klar":"  orders.insert(user, order) → order …"}]}],"edges":[{"from":"server.buildServer","to":"RateLimiter","kind":"creates","status":"added"},{"from":"server.buildServer","to":"limits.rateLimit","kind":"calls","status":"added"},{"from":"server.buildServer","to":"Router.use","kind":"calls","status":"context"},{"from":"server.buildServer","to":"Clock.systemClock","kind":"reads","status":"added"},{"from":"Router.handle","to":"auth.requireAuth","kind":"calls","status":"context","resolution":"inferred","label":"middleware chain"},{"from":"Router.handle","to":"limits.rateLimit","kind":"calls","status":"added","resolution":"inferred","label":"runs the middleware it returns"},{"from":"Router.handle","to":"orders.createOrder","kind":"calls","status":"context","resolution":"inferred","label":"route table"},{"from":"limits.rateLimit","to":"RateLimiter.check","kind":"calls","status":"added"},{"from":"RateLimiter.check","to":"Clock.now","kind":"calls","status":"added","resolution":"dispatch"},{"from":"RateLimiter.check","to":"RateLimiter.bucketFor","kind":"calls","status":"added"},{"from":"RateLimiter.check","to":"TokenBucket.refill","kind":"calls","status":"added"},{"from":"RateLimiter.check","to":"TokenBucket.tryTake","kind":"calls","status":"added"},{"from":"RateLimiter.check","to":"TokenBucket.secondsUntilNext","kind":"calls","status":"added"},{"from":"RateLimiter.bucketFor","to":"config.LIMITS","kind":"reads","status":"added"},{"from":"RateLimiter.bucketFor","to":"TokenBucket","kind":"creates","status":"added"},{"from":"orders.createOrder","to":"db.orders.insert","kind":"calls","status":"context"},{"from":"orders.createOrder","to":"config.MAX_ORDERS_PER_MINUTE","kind":"reads","status":"removed"},{"from":"orders.createOrder","to":"orders.recentOrders","kind":"writes","status":"removed"}],"flows":[{"id":"request","name":"A request passes through the limiter","description":"Every authenticated request now spends one token before it reaches its route. An empty bucket ends the request with 429 and a retry-after header.","steps":["Router.handle","auth.requireAuth","limits.rateLimit","RateLimiter.check","RateLimiter.bucketFor","TokenBucket.refill","TokenBucket.tryTake","orders.createOrder"]},{"id":"startup","name":"Server start-up wiring","description":"buildServer creates one RateLimiter for the process and installs its middleware directly after authentication.","steps":["server.buildServer","Clock.systemClock","RateLimiter","limits.rateLimit","Router.use"]}],"notes":[{"kind":"risk","refs":["RateLimiter.buckets"],"text":"Buckets are never evicted. Memory grows with every distinct client the process has ever seen."},{"kind":"behaviour","refs":["orders.createOrder","config.MAX_ORDERS_PER_MINUTE","config.LIMITS"],"text":"Order creation is no longer capped at 5 per minute. It now shares the general allowance, so a free user can place 20 orders at once and then about 60 a minute."},{"kind":"behaviour","refs":["server.buildServer","limits.rateLimit"],"text":"The limiter runs after requireAuth, so unauthenticated requests are not limited at all."},{"kind":"note","refs":["RateLimiter"],"text":"Limits are held in process memory, so each server instance counts separately."}]}</script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script type="module">
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ---------- tokens the layout needs ----------
const cssVars = getComputedStyle(document.documentElement);
const token = (name) => cssVars.getPropertyValue("--" + name).trim();
const size = (name) => parseFloat(token(name));
const L = {
  unit: size("grid-unit"), canvas: size("grid-canvas"),
  headH: size("card-head-height"), sumH: size("card-summary-height"), rowH: size("card-row-height"),
  padX: size("card-padding-x"), padY: size("card-padding-y"), gutter: size("card-gutter"), kind: size("card-kind"),
  wMin: size("card-width-min"), wMax: size("card-width-max"), gap: size("space-2"), badge: size("badge-size"),
  layerGap: size("diagram-layer-gap"), nodeGap: size("diagram-node-gap"), edgeGap: size("diagram-edge-gap"),
  margin: size("space-10"), slow: size("motion-duration-slow"),
};
const snap = (v) => Math.round(v / L.unit) * L.unit;
const snapUp = (v) => Math.ceil(v / L.unit) * L.unit;

// ---------- load ----------
async function loadGraph() {
  const inline = $("#openarc-data").textContent.trim();
  if (inline) return JSON.parse(inline);
  const src = new URLSearchParams(location.search).get("src") || "graph.json";
  return (await fetch(src)).json();
}
const G = await loadGraph();

const comps = new Map(), members = new Map();
for (const c of G.components) {
  comps.set(c.id, c);
  for (const m of c.members) { m.component = c; members.set(m.id, m); }
}
const compOf = (id) => members.get(id)?.component || comps.get(id);
const edges = G.edges.map((e, i) => ({ resolution: "static", ...e, i }));
const outE = new Map(), inE = new Map();
for (const e of edges) {
  (outE.get(e.from) || outE.set(e.from, []).get(e.from)).push(e);
  (inE.get(e.to) || inE.set(e.to, []).get(e.to)).push(e);
}
const STATUS_LABEL = { added: "new", changed: "changed", removed: "removed", context: "context" };
const GUTTER = { added: "+", changed: "~", removed: "−", context: "" };
const MK = { function: "fn", const: "const", state: "state", type: "type" };
const ICON = {
  close: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>`,
  chevron: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>`,
};

// ---------- sidebar ----------
const side = $("#side");
function renderSide() {
  const counts = { added: 0, changed: 0, removed: 0 };
  for (const m of members.values()) if (m.status in counts) counts[m.status]++;
  side.innerHTML = `
    <header class="side-head type-body-strong">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M2.5 12.5a5.5 5.5 0 0 1 11 0"/><circle cx="2.5" cy="12.5" r="1.25" fill="currentColor" stroke="none"/><circle cx="13.5" cy="12.5" r="1.25" fill="currentColor" stroke="none"/></svg>
      OpenArc
    </header>
    <div class="side-body">
      <div>
        <h1 class="type-display">${esc(G.change.title)}</h1>
        <p class="summary type-body-sm">${esc(G.change.summary)}</p>
        <div class="stats type-code-sm">
          ${counts.added ? `<span class="stat s-added">+${counts.added} added</span>` : ""}
          ${counts.changed ? `<span class="stat s-changed">~${counts.changed} changed</span>` : ""}
          ${counts.removed ? `<span class="stat s-removed">−${counts.removed} removed</span>` : ""}
        </div>
      </div>
      ${G.flows?.length ? `<section class="sec"><h2 class="type-overline">Flows</h2><div class="flows">${G.flows.map((f) => `
        <button class="flow" data-flow="${esc(f.id)}" type="button">
          <span class="fn"><span class="type-body-strong">${esc(f.name)}</span><small class="type-code-meta">${f.steps.length} steps</small></span>
          <span class="fd type-body-sm">${esc(f.description || "")}</span>
        </button>`).join("")}</div></section>` : ""}
      ${G.notes?.length ? `<section class="sec"><h2 class="type-overline">For the reviewer</h2><div class="notes-list">${G.notes.map((n, i) => `
        <button class="note k-${esc(n.kind)}" data-note="${i}" type="button"><span class="nk type-overline">${esc(n.kind)}</span><span class="type-body-sm">${esc(n.text)}</span></button>`).join("")}</div></section>` : ""}
    </div>
    <footer class="side-foot">
      <div class="legend type-label">
        <span><i class="sw sw-added"></i>Added</span>
        <span><svg viewBox="0 0 24 8"><path d="M0 4H24"/></svg>Calls</span>
        <span><i class="sw sw-changed"></i>Changed</span>
        <span><svg viewBox="0 0 24 8"><path class="ln-inferred" d="M0 4H24"/></svg>Inferred</span>
        <span><i class="sw sw-removed"></i>Removed</span>
        <span><svg viewBox="0 0 24 8"><path class="ln-data" d="M1 4H24"/></svg>Reads, writes</span>
        <span><i class="sw sw-context"></i>Context</span>
        <span><svg viewBox="0 0 24 8"><path class="ln-creates" d="M0 4H24"/></svg>Creates</span>
      </div>
      <div class="foot-row type-label">
        <span>Drag to pan · ⌘ scroll to zoom</span>
        <span class="type-code-meta">graph ${esc(G.openarc)}</span>
      </div>
    </footer>`;
}
renderSide();

// ---------- cards: measure, lay out, render ----------
const shortSig = (s = "") => {
  const m = s.match(/^\((.*?)\)(.*)$/);
  if (!m) return s;
  const params = m[1].split(",").map((p) => p.split(/[:=]/)[0].trim()).filter(Boolean).join(", ");
  return `(${params})${m[2].replace("->", "→")}`;
};
const shortPath = (f = "") => f.replace(/^src\//, "");

// Card width comes from the widest line it has to show, rounded up to the grid.
const fontOf = (role) => token(`type-${role}-font`).replace(/\/\S+/, "");
const roles = ["heading", "code-strong", "code-sm", "code-meta", "overline"];
await Promise.race([
  Promise.all(roles.map((r) => document.fonts.load(fontOf(r)))),
  new Promise((r) => setTimeout(r, 1500)),
]);
const measure = document.createElement("canvas").getContext("2d");
function textWidth(role, text) {
  measure.font = fontOf(role);
  const tracking = parseFloat(token(`type-${role}-tracking`)) || 0;
  const sz = size(`type-${role}-size`);
  const t = token(`type-${role}-case`) === "uppercase" ? text.toUpperCase() : text;
  return measure.measureText(t).width + tracking * sz * t.length;
}
// Header marks: counts of what changed inside, and a square when the whole class came or went.
const memberCounts = (c) => {
  const n = { added: 0, changed: 0, removed: 0 };
  for (const m of c.members) if (m.status in n) n[m.status]++;
  return Object.entries(n).filter(([, v]) => v);
};
const WHOLE = { added: "New class", removed: "Removed class" };
function changeMarks(c) {
  if (c.status === "context") return "";
  const counts = memberCounts(c).map(([s, v]) => `<span class="count s-${s}">${GUTTER[s]}${v}</span>`).join("");
  const whole = WHOLE[c.status] ? `<span class="whole s-${c.status} type-code-strong" title="${WHOLE[c.status]}" aria-label="${WHOLE[c.status]}">${GUTTER[c.status]}</span>` : "";
  return `${counts ? `<span class="counts type-code-sm">${counts}</span>` : ""}${whole}`;
}
function naturalWidth(c) {
  const sp1 = size("space-1");
  const counts = c.status === "context" ? 0 : memberCounts(c).reduce((w, [s, v]) => w + textWidth("code-sm", GUTTER[s] + v) + 2 * sp1 + sp1, 0);
  const marks = counts + (WHOLE[c.status] ? L.gap + size("badge-mark") : 0);
  const head = Math.max(
    textWidth("code-meta", c.kind) + L.gap + Math.min(textWidth("code-meta", shortPath(c.file)), L.wMin / 2),
    textWidth("heading", c.name) + L.gap + marks + L.gap + L.badge,
  );
  const rows = c.members.map((m) =>
    L.gutter + L.gap + L.kind + L.gap + textWidth("code-strong", m.name) + L.gap + textWidth("code-sm", shortSig(m.signature)) + L.gap + L.badge);
  return Math.max(head, ...rows) + 2 * L.padX;
}
const cardH = (c) => L.headH + (c.summary ? L.sumH : 0) + 2 * L.padY + c.members.length * L.rowH;
const widths = new Map(G.components.map((c) => [c.id, Math.min(L.wMax, Math.max(L.wMin, snapUp(naturalWidth(c))))]));

    const st = (m || c).status;
    const inf = e.resolution === "inferred" ? `<span class="inf type-label" title="Asserted by the agent, not resolved from the code${e.label ? ": " + esc(e.label) : ""}">inferred</span>`
      : e.resolution === "dispatch" ? `<span class="inf type-label" title="Called through an interface or function value">dispatch</span>` : "";
    return `<li><button type="button" data-goto="${esc(id)}"><span class="ek type-code-meta">${esc(e.kind)}</span><span class="dot s-${e.status === "context" ? st : e.status}"></span><span class="en type-code-strong">${name}</span>${inf}</button></li>`;
  }).join("")}</ul>`;
}
function effectsHTML(m) {
  if (!m.effects && !m.baseEffects) return "";
  const now = m.effects || [], was = m.baseEffects || now;
  const chips = [
    ...now.map((x) => `<span class="chip ${was.includes(x) ? "" : "new"}">${esc(x)}</span>`),
    ...was.filter((x) => !now.includes(x)).map((x) => `<span class="chip gone">${esc(x)}</span>`),
  ];
  return `<section><h3 class="type-overline">Effects</h3><div class="chips type-code-sm">${chips.join("") || `<span class="chip">none</span>`}</div></section>`;
}
function notesFor(id) {
  const ns = (G.notes || []).filter((n) => n.refs.includes(id) || n.refs.includes(compOf(id)?.id));
  if (!ns.length) return "";
  return `<section class="notes"><h3 class="type-overline">For the reviewer</h3>${ns.map((n) => `<div class="note k-${esc(n.kind)}"><span class="nk type-overline">${esc(n.kind)}</span><span class="type-body-sm">${esc(n.text)}</span></div>`).join("")}</section>`;
}
function rawHTML(x, file) {
  const head = x.source?.code != null, base = x.base?.code != null;
  if (!head && !base) return "";
  const first = head ? "head" : "base";
  const tab = (k, label) => `<button type="button" data-tab="${k}" class="type-label ${k === first ? "on" : ""}">${label}</button>`;
  const pane = (k, a, suffix) => `<div data-pane="${k}" ${first !== k ? "hidden" : ""}><div class="crumb type-code-meta">${esc(a.file || file)}:${a.lines[0]}–${a.lines[1]}${suffix}</div><pre class="code type-code">${codeHTML(a.code, a.lines[0])}</pre></div>`;
  return `<details class="raw"><summary class="type-body-sm">${ICON.chevron}Source code</summary>
    <p class="why type-label">The code this was written from, for checking it against the Klar.</p>
    ${head && base ? `<div class="seg">${tab("head", "After")}${tab("base", "Before")}</div>` : ""}
    ${head ? pane("head", x.source, "") : ""}
    ${base ? pane("base", x.base, " (before)") : ""}
  </details>`;
}
function openDrawer(id) {
  const m = members.get(id), c = compOf(id);
  if (!c) return;
  const top = `<div class="dw-top"><span class="crumb type-code-meta">${esc(c.file || "")}</span><button class="x" type="button" aria-label="Close">${ICON.close}</button></div>`;
  let body;
  if (m) {
    body = `${top}
      <h2 class="type-title-code"><span class="cn">${esc(c.name)}.</span>${esc(m.name)}</h2>
      <div class="badges"><span class="pill type-overline s-${m.status}">${STATUS_LABEL[m.status]}</span><span class="tag type-code-meta">${esc(m.kind)}</span>${m.visibility === "private" ? `<span class="tag type-code-meta">private</span>` : ""}</div>
      ${m.summary ? `<p class="lead type-lead">${esc(m.summary)}</p>` : ""}
      ${m.klar ? `<section><h3 class="type-overline">Klar</h3><pre class="klar type-code">${klarHTML(m.klar, m.id)}</pre></section>` : ""}
      ${m.klar && (m.effects || m.baseEffects) ? "" : effectsHTML(m)}
      ${(outE.get(id) || []).length ? `<section><h3 class="type-overline">Uses</h3>${linkList(outE.get(id), "out")}</section>` : ""}
      ${(inE.get(id) || []).length ? `<section><h3 class="type-overline">Used by</h3>${linkList(inE.get(id), "in")}</section>` : ""}
      ${notesFor(id)}
      ${rawHTML(m, c.file)}`;
  } else {
    const ins = c.members.flatMap((x) => inE.get(x.id) || []).concat(inE.get(c.id) || []).filter((e) => compOf(e.from) !== c);
    body = `${top}
      <h2 class="type-title-code">${esc(c.name)}</h2>
      <div class="badges"><span class="pill type-overline s-${c.status}">${STATUS_LABEL[c.status]}</span><span class="tag type-code-meta">${esc(c.kind)}</span></div>
      ${c.summary ? `<p class="lead type-lead">${esc(c.summary)}</p>` : ""}
      ${c.klar ? `<section><h3 class="type-overline">Klar</h3><pre class="klar type-code">${klarHTML(c.klar, c.id)}</pre></section>` : ""}
      <section><h3 class="type-overline">Members</h3><ul class="links">${c.members.map((x) => `<li><button type="button" data-goto="${esc(x.id)}"><span class="ek type-code-meta">${MK[x.kind] || esc(x.kind)}</span><span class="dot s-${x.status}"></span><span class="en type-code-strong">${esc(x.name)}</span></button></li>`).join("")}</ul></section>
      ${ins.length ? `<section><h3 class="type-overline">Used by</h3>${linkList(ins, "in")}</section>` : ""}
      ${notesFor(c.id)}`;
  }
  drawerEl.innerHTML = `<div class="dw">${body}</div>`;
  drawerEl.classList.add("open");
  $("#app").classList.add("inspecting");
  drawerEl.scrollTop = 0;
}
drawerEl.addEventListener("click", (e) => {
  if (e.target.closest(".x")) { S.note = null; select(null); return; }
  const g = e.target.closest("[data-goto]");
  if (g) { S.note = null; select(g.dataset.goto); return; }
  const t = e.target.closest("[data-tab]");
  if (t) {
    $$("[data-tab]", drawerEl).forEach((b) => b.classList.toggle("on", b === t));
    $$("[data-pane]", drawerEl).forEach((p) => (p.hidden = p.dataset.pane !== t.dataset.tab));
  }
});

document.title = `${G.change.title} · OpenArc`;
fit(false);
addEventListener("resize", () => fit(false));
</script>
</body>
</html>
