<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenArc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f4f1; --dot: #d9d9d3; --panel: #ffffff; --card: #ffffff; --raise: #fafaf8;
  --ink: #18191c; --ink-2: #3d3f45; --muted: #6c6f77; --faint: #9b9ea6; --line: #e4e4df; --line-2: #d4d4ce;
  --add: #1a8f4c; --add-bg: #e7f5ec; --chg: #b26d00; --chg-bg: #fbf0dc; --del: #c9372c; --del-bg: #fbe9e7;
  --ctx: #8d9098; --ctx-bg: #f0f0ed; --accent: #4353d6; --accent-bg: #eceefd;
  --shadow: 0 1px 2px rgb(20 20 30 / 0.06), 0 4px 16px rgb(20 20 30 / 0.06);
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --dot: #26282d; --panel: #16171a; --card: #1b1c20; --raise: #202126;
    --ink: #ececee; --ink-2: #c9cad0; --muted: #9a9da6; --faint: #6d7079; --line: #2a2c31; --line-2: #34363c;
    --add: #43c97f; --add-bg: #15301f; --chg: #e3a643; --chg-bg: #33280f; --del: #f06a5f; --del-bg: #3a1a17;
    --ctx: #7c7f88; --ctx-bg: #1f2024; --accent: #8e99ff; --accent-bg: #23264a;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px rgb(0 0 0 / 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1012; --dot: #26282d; --panel: #16171a; --card: #1b1c20; --raise: #202126;
  --ink: #ececee; --ink-2: #c9cad0; --muted: #9a9da6; --faint: #6d7079; --line: #2a2c31; --line-2: #34363c;
  --add: #43c97f; --add-bg: #15301f; --chg: #e3a643; --chg-bg: #33280f; --del: #f06a5f; --del-bg: #3a1a17;
  --ctx: #7c7f88; --ctx-bg: #1f2024; --accent: #8e99ff; --accent-bg: #23264a;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px rgb(0 0 0 / 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; height: 100dvh; }

/* ---------- side panel ---------- */
#side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 22px; z-index: 3; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
.brand svg { width: 20px; height: 20px; color: var(--accent); }
.brand .ver { margin-left: auto; font: 500 11px var(--mono); color: var(--faint); }
#side h1 { font-size: 19px; line-height: 1.3; letter-spacing: -0.02em; margin: 0 0 8px; font-weight: 650; }
.summary { color: var(--ink-2); margin: 0; font-size: 13.5px; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.stat { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 6px; }
.stat.s-added { color: var(--add); background: var(--add-bg); }
.stat.s-changed { color: var(--chg); background: var(--chg-bg); }
.stat.s-removed { color: var(--del); background: var(--del-bg); }
.sec h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.flow { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s, background .15s; }
.flow:hover { border-color: var(--line-2); background: var(--raise); }
.flow .fn { font-weight: 600; font-size: 13.5px; display: flex; gap: 8px; align-items: baseline; }
.flow .fn small { margin-left: auto; color: var(--faint); font: 500 11px var(--mono); }
.flow .fd { display: none; color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.flow.on { border-color: var(--accent); background: var(--accent-bg); }
.flow.on .fd { display: block; }
.note { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 2px solid var(--line-2); padding: 4px 0 4px 12px; margin-bottom: 10px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.note .nk { display: block; font: 600 10.5px var(--sans); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
.note.k-risk { border-color: var(--del); } .note.k-risk .nk { color: var(--del); }
.note.k-behaviour { border-color: var(--chg); } .note.k-behaviour .nk { color: var(--chg); }
.note.k-note .nk { color: var(--muted); }
.note:hover { color: var(--ink); }
.note.on { color: var(--ink); background: var(--raise); }
.legend { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend svg { width: 26px; height: 8px; flex: none; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* ---------- stage ---------- */
#stage { position: relative; overflow: hidden; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); }
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.group { position: absolute; border: 1px dashed var(--line-2); border-radius: 18px; }
.group > span { position: absolute; top: 12px; left: 18px; font: 500 12px var(--mono); color: var(--faint); }

.card { position: absolute; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; transition: opacity .2s; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.card.s-added::before { background: var(--add); }
.card.s-changed::before { background: var(--chg); }
.card.s-removed::before { background: var(--del); }
.card.s-context { background: var(--raise); border-style: dashed; box-shadow: none; }
.card-head { height: 56px; padding: 9px 14px 0 16px; cursor: pointer; }
.card-head .kind { font: 500 10.5px var(--mono); color: var(--faint); letter-spacing: .02em; display: flex; gap: 8px; align-items: center; }
.card-head .kind .path { color: var(--faint); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card-head .kind .pill { margin-left: auto; flex: none; }
.card-head .cname { display: block; font-weight: 650; font-size: 15.5px; letter-spacing: -0.015em; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.s-context .cname { color: var(--ink-2); font-weight: 600; }
.pill { font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 5px; }
.pill.s-added { color: var(--add); background: var(--add-bg); }
.pill.s-changed { color: var(--chg); background: var(--chg-bg); }
.pill.s-removed { color: var(--del); background: var(--del-bg); }
.pill.s-context { color: var(--ctx); background: var(--ctx-bg); }
.card-sum { height: 40px; margin: 0; padding: 0 14px 0 16px; font-size: 12px; line-height: 1.4; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.rows { list-style: none; margin: 0; padding: 0 0 8px; border-top: 1px solid var(--line); }
.row { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; cursor: pointer; position: relative; transition: background .12s, opacity .2s; }
.row:hover { background: var(--raise); }
.row .g { width: 10px; font: 600 12px var(--mono); text-align: center; flex: none; }
.row.s-added .g { color: var(--add); } .row.s-changed .g { color: var(--chg); } .row.s-removed .g { color: var(--del); }
.row .mk { font: 500 10px var(--mono); color: var(--faint); width: 34px; flex: none; }
.row .mn { font: 500 13px var(--mono); white-space: nowrap; }
.row .sig { font: 400 11.5px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.s-removed .mn { text-decoration: line-through; text-decoration-color: var(--del); color: var(--muted); }
.row.s-context .mn { color: var(--muted); }
.row.sel { background: var(--accent-bg); }
.row.sel .mn { color: var(--accent); }
.row .step { display: none; margin-left: auto; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 10.5px var(--sans); align-items: center; justify-content: center; }
.row.has-step .step, .card-head .step.on { display: inline-flex; }
.card-head .step { display: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 10.5px var(--sans); align-items: center; justify-content: center; margin-left: auto; }
.card.selc { outline: 2px solid var(--accent); outline-offset: 1px; }

.edge { fill: none; stroke-width: 1.5; transition: opacity .2s, stroke-width .15s; }
.edge.st-added { stroke: var(--add); } .edge.st-changed { stroke: var(--chg); } .edge.st-removed { stroke: var(--del); } .edge.st-context { stroke: var(--ctx); }
.edge.inferred { stroke-dasharray: 6 4; }
.edge.k-reads, .edge.k-writes { stroke-dasharray: 1.5 4; stroke-linecap: round; stroke-width: 1.8; }
.edge.k-creates { stroke-width: 2.2; }
.edge.hov, .edge.hl { stroke-width: 2.6; }
.flowpath { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 7; animation: march 0.9s linear infinite; opacity: .9; }
@keyframes march { to { stroke-dashoffset: -18; } }
.m-added { fill: var(--add); } .m-changed { fill: var(--chg); } .m-removed { fill: var(--del); } .m-context { fill: var(--ctx); } .m-accent { fill: var(--accent); }

.focus .card:not(.hl) { opacity: .32; }
.focus .card.hl .row:not(.hl) { opacity: .4; }
.focus .edge:not(.hl) { opacity: .1; }

.zoombar { position: absolute; right: 16px; bottom: 16px; display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.zoombar button { background: none; border: 0; width: 34px; height: 32px; cursor: pointer; font-size: 16px; color: var(--ink-2); }
.zoombar button:hover { background: var(--raise); }
.zoombar .pct { font: 500 11.5px var(--mono); color: var(--muted); width: 48px; text-align: center; }
.zoombar .fit { width: auto; padding: 0 12px; font-size: 12.5px; border-left: 1px solid var(--line); }
.hint { position: absolute; left: 16px; bottom: 16px; font-size: 12px; color: var(--faint); pointer-events: none; }
#sideToggle { display: none; }

/* ---------- drawer ---------- */
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgb(0 0 0 / .06); overflow-y: auto; transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); z-index: 4; }
#drawer.open { transform: none; }
.dw { padding: 18px 22px 40px; }
.dw-top { display: flex; align-items: center; gap: 8px; }
.crumb { font: 500 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { margin-left: auto; background: none; border: 0; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 18px; flex: none; }
.x:hover { background: var(--raise); color: var(--ink); }
.dw h2 { font: 600 22px var(--mono); letter-spacing: -0.02em; margin: 6px 0 8px; word-break: break-word; }
.dw h2 .cn { color: var(--faint); font-weight: 500; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tag { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line); padding: 0 6px; border-radius: 5px; }
.dw .lead { font-size: 15px; line-height: 1.55; color: var(--ink); margin: 14px 0 0; }
.dw section { margin-top: 22px; }
.dw h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dw h3 .tag { text-transform: none; letter-spacing: 0; }
pre.klar, pre.code { margin: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 0; font: 400 12px/1.7 var(--mono); overflow-x: auto; }
pre.klar .ln, pre.code .ln { display: block; padding: 0 14px 0 0; white-space: pre; min-height: 1.65em; }
pre.klar .gut { display: inline-block; width: 26px; text-align: center; color: var(--faint); user-select: none; }
pre.klar .ln-add { background: color-mix(in srgb, var(--add-bg) 70%, transparent); } pre.klar .ln-add .gut { color: var(--add); }
pre.klar .ln-del { background: color-mix(in srgb, var(--del-bg) 70%, transparent); } pre.klar .ln-del .gut { color: var(--del); }
pre.klar .ln-del > :not(.gut) { opacity: .75; }
pre.klar .ln-chg .gut { color: var(--chg); }
.t-kw { color: var(--accent); font-weight: 500; }
.t-str { color: var(--ink-2); font-style: italic; }
.t-doc { color: var(--muted); font-style: italic; }
.t-ty { color: var(--chg); }
.t-num { color: var(--add); }
.t-op { color: var(--faint); }
.t-com { color: var(--faint); font-style: italic; }
.t-at { color: var(--faint); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 12px var(--mono); padding: 3px 9px; border-radius: 7px; background: var(--raise); border: 1px solid var(--line); }
.chip.gone { text-decoration: line-through; color: var(--del); border-color: transparent; background: var(--del-bg); }
.chip.new { color: var(--add); border-color: transparent; background: var(--add-bg); }
.links { list-style: none; margin: 0; padding: 0; }
.links button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; text-align: left; }
.links button:hover { background: var(--raise); }
.links .ek { font: 500 10.5px var(--mono); color: var(--faint); width: 52px; flex: none; }
.links .en { font: 500 13px var(--mono); }
.links .en .cn { color: var(--faint); }
.links .inf { margin-left: auto; font: 500 10.5px var(--sans); color: var(--muted); border: 1px dashed var(--line-2); padding: 0 6px; border-radius: 5px; white-space: nowrap; }
.links .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.s-added { background: var(--add); } .dot.s-changed { background: var(--chg); } .dot.s-removed { background: var(--del); } .dot.s-context { background: var(--ctx); }
details.raw { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
details.raw summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
details.raw summary::-webkit-details-marker { display: none; }
details.raw summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 15px; }
details.raw[open] summary::before { transform: rotate(90deg); }
details.raw .why { font-size: 12px; color: var(--faint); margin: 8px 0 10px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
.tabs button { background: none; border: 0; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: var(--raise); color: var(--ink); font-weight: 500; }
pre.code .no { display: inline-block; width: 38px; padding-right: 12px; text-align: right; color: var(--faint); user-select: none; }
.dw .notes .note { cursor: default; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; }
  #side { position: absolute; inset: 0 0 auto 0; max-height: 78dvh; border-right: 0; border-bottom: 1px solid var(--line); box-shadow: var(--shadow); transform: translateY(-102%); transition: transform .22s; padding: 18px 16px; }
  #app.side-open #side { transform: none; }
  #sideToggle { display: inline-flex; position: absolute; left: 16px; top: 16px; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); font-size: 13px; font-weight: 500; cursor: pointer; }
  #drawer { top: auto; height: 78dvh; width: 100%; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; transform: translateY(102%); }
  .hint { display: none; }
  .dw { padding: 16px 16px 32px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="stage">
    <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
    <button id="sideToggle" type="button">Overview</button>
    <div class="hint">Drag to pan · Ctrl/⌘ + scroll to zoom · click a function to inspect it</div>
    <div class="zoombar">
      <button type="button" data-z="out" aria-label="Zoom out">−</button>
      <span class="pct">100%</span>
      <button type="button" data-z="in" aria-label="Zoom in">+</button>
      <button type="button" class="fit" data-z="fit">Fit</button>
    </div>
    <aside id="drawer" aria-live="polite"></aside>
  </main>
</div>

<script id="openarc-data" type="application/json"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script type="module">
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ---------- load ----------
async function loadGraph() {
  const inline = $("#openarc-data").textContent.trim();
  if (inline) return JSON.parse(inline);
  const src = new URLSearchParams(location.search).get("src") || "graph.json";
  return (await fetch(src)).json();
}
const G = await loadGraph();

const comps = new Map(), members = new Map();
for (const c of G.components) {
  comps.set(c.id, c);
  for (const m of c.members) { m.component = c; members.set(m.id, m); }
}
const compOf = (id) => members.get(id)?.component || comps.get(id);
const edges = G.edges.map((e, i) => ({ resolution: "static", ...e, i }));
const outE = new Map(), inE = new Map();
for (const e of edges) {
  (outE.get(e.from) || outE.set(e.from, []).get(e.from)).push(e);
  (inE.get(e.to) || inE.set(e.to, []).get(e.to)).push(e);
}
const STATUS_LABEL = { added: "new", changed: "changed", removed: "removed", context: "context" };
const GUTTER = { added: "+", changed: "~", removed: "−", context: "" };
const MK = { function: "fn", const: "const", state: "state", type: "type" };

// ---------- side panel ----------
const side = $("#side");
function renderSide() {
  const counts = { added: 0, changed: 0, removed: 0 };
  for (const m of members.values()) if (m.status in counts) counts[m.status]++;
  side.innerHTML = `
    <div class="brand">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 16 A8 8 0 0 1 17 16"/><circle cx="3" cy="16" r="1.6" fill="currentColor" stroke="none"/><circle cx="17" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>
      OpenArc <span class="ver">graph ${esc(G.openarc)}</span>
    </div>
    <div>
      <h1>${esc(G.change.title)}</h1>
      <p class="summary">${esc(G.change.summary)}</p>
      <div class="stats">
        ${counts.added ? `<span class="stat s-added">+${counts.added} added</span>` : ""}
        ${counts.changed ? `<span class="stat s-changed">~${counts.changed} changed</span>` : ""}
        ${counts.removed ? `<span class="stat s-removed">−${counts.removed} removed</span>` : ""}
      </div>
    </div>
    ${G.flows?.length ? `<div class="sec"><h2>Flows</h2>${G.flows.map((f) => `
      <button class="flow" data-flow="${esc(f.id)}" type="button">
        <span class="fn">${esc(f.name)}<small>${f.steps.length} steps</small></span>
        <span class="fd">${esc(f.description || "")}</span>
      </button>`).join("")}</div>` : ""}
    ${G.notes?.length ? `<div class="sec"><h2>For the reviewer</h2>${G.notes.map((n, i) => `
      <button class="note k-${esc(n.kind)}" data-note="${i}" type="button"><span class="nk">${esc(n.kind)}</span>${esc(n.text)}</button>`).join("")}</div>` : ""}
    <div class="legend">
      <span><i style="background:var(--add)"></i>Added</span>
      <span><svg viewBox="0 0 26 8"><path d="M1 4H25" stroke="var(--muted)" stroke-width="1.6"/></svg>Calls</span>
      <span><i style="background:var(--chg)"></i>Changed</span>

    else if (com) out += `<span class="t-com">${esc(t)}</span>`;

      <div class="dw-top"><span class="crumb">${esc(c.file || "")}</span><button class="x" type="button" aria-label="Close">×</button></div>
      <h2><span class="cn">${esc(c.name)}.</span>${esc(m.name)}</h2>
      <div class="badges"><span class="pill s-${m.status}">${STATUS_LABEL[m.status]}</span><span class="tag">${esc(m.kind)}</span>${m.visibility === "private" ? `<span class="tag">private</span>` : ""}</div>
      ${m.summary ? `<p class="lead">${esc(m.summary)}</p>` : ""}
      ${m.klar ? `<section><h3>Klar</h3><pre class="klar">${klarHTML(withoutDoc(m.klar, m.summary))}</pre></section>` : ""}
      ${effectsHTML(m)}
      ${(outE.get(id) || []).length ? `<section><h3>Uses</h3>${linkList(outE.get(id), "out")}</section>` : ""}
      ${(inE.get(id) || []).length ? `<section><h3>Used by</h3>${linkList(inE.get(id), "in")}</section>` : ""}
      ${notesFor(id)}
      ${rawHTML(m, c.file)}`;
  } else {
    const ins = c.members.flatMap((x) => inE.get(x.id) || []).concat(inE.get(c.id) || []).filter((e) => compOf(e.from) !== c);
    body = `
      <div class="dw-top"><span class="crumb">${esc(c.file || "")}</span><button class="x" type="button" aria-label="Close">×</button></div>
      <h2>${esc(c.name)}</h2>
      <div class="badges"><span class="pill s-${c.status}">${STATUS_LABEL[c.status]}</span><span class="tag">${esc(c.kind)}</span></div>
      ${c.summary ? `<p class="lead">${esc(c.summary)}</p>` : ""}
      ${c.klar ? `<section><h3>Klar</h3><pre class="klar">${klarHTML(c.klar)}</pre></section>` : ""}
      <section><h3>Members</h3><ul class="links">${c.members.map((x) => `<li><button type="button" data-goto="${esc(x.id)}"><span class="ek">${MK[x.kind] || esc(x.kind)}</span><span class="dot s-${x.status}"></span><span class="en">${esc(x.name)}</span></button></li>`).join("")}</ul></section>
      ${ins.length ? `<section><h3>Used by</h3>${linkList(ins, "in")}</section>` : ""}
      ${notesFor(c.id)}`;
  }
  drawer.innerHTML = `<div class="dw">${body}</div>`;
  drawer.classList.add("open");
  drawer.scrollTop = 0;
}
drawer.addEventListener("click", (e) => {
  if (e.target.closest(".x")) { S.note = null; select(null); return; }
  const g = e.target.closest("[data-goto]");
  if (g) { S.note = null; select(g.dataset.goto); return; }
  const t = e.target.closest("[data-tab]");
  if (t) {
    $$("[data-tab]", drawer).forEach((b) => b.classList.toggle("on", b === t));
    $$("[data-pane]", drawer).forEach((p) => (p.hidden = p.dataset.pane !== t.dataset.tab));
  }
});

document.title = `${G.change.title} · OpenArc`;
fit(false);
addEventListener("resize", () => fit(false));
</script>
</body>
</html>
